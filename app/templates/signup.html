{% extends "base.html" %}

{% block content %}
<div class="glass-panel auth-container animate-fade-in">
    <div class="auth-header">
        <h1>Create Account</h1>
        <p>Sign up for IEI Dispatcher</p>
    </div>

    <form method="POST" action="{{ url_for('main.signup') }}">
        <div class="form-group">
            <label for="email">Username</label>
            <input type="text" id="email" name="email" placeholder="e.g. john.doe" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%">
            Create Account <i class="fa-solid fa-user-plus" style="margin-left: 0.5rem;"></i>
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="{{ url_for('main.login') }}" style="color: var(--primary-color);">Log In</a>
    </div>
</div>
{% endblock %}
