{% extends "base.html" %}

{% block content %}
<div class="glass-panel auth-container animate-fade-in">
    <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to your dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('main.login') }}">
        <div class="form-group">
            <label for="email">Username</label>
            <input type="text" id="email" name="email" placeholder="e.g. admin" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%">
            Continue <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
        </button>
    </form>
</div>
{% endblock %}
